;==========================================================
; Polybar Configuration
;==========================================================

[colors]
; semantic colors - updated by theme switcher
background     = #2e3440
background-alt = #3b4252
background-dim = #434c5e
disabled       = #4c566a
foreground     = #d8dee9
foreground-alt = #eceff4
accent         = #5e81ac
accent-alt     = #88c0d0
accent-dim     = #81a1c1
urgent         = #bf616a
warning        = #d08770
info           = #ebcb8b
success        = #a3be8c
purple         = #b48ead
teal           = #8fbcbb

;==========================================================
; Bar Main Configuration
;==========================================================
[bar/main]
; Monitor
monitor = ${env:MONITOR:}

; Size and position
width = 100%
height = 26
offset-x = 0
offset-y = 0
bottom = false
override-redirect = true
wm-restack = generic

; Colors
background = ${colors.background}
foreground = ${colors.foreground}

; Border
border-size = 0

; Padding
padding-left = 0
padding-right = 1
module-margin-left = 1
module-margin-right = 1

; Fonts
font-0 = "JetBrains Mono Nerd Font:size=10;2"
font-1 = "JetBrains Mono Nerd Font:size=12;2"
font-2 = "Noto Color Emoji:scale=10:style=Regular;2"

; Modules layout
modules-left = dwm-tags window
modules-center = date
modules-right = network-custom cpu memory volume battery tray

; No separator between modules
separator = ""
separator-padding = 0

; Cursor settings
cursor-click = pointer
cursor-scroll = ns-resize

;==========================================================
; DWM Workspace Module
;==========================================================
[module/dwm-tags]
type = internal/xworkspaces

group-by-monitor = false
enable-click = false
enable-scroll = true
reverse-scroll = false

format = <label-state>

label-active = %name%
label-active-foreground = ${colors.accent-alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

label-empty =
label-empty-padding = 0

;==========================================================
; Custom Network Module
;==========================================================
[module/network-custom]
type = custom/script
exec = ~/.config/polybar/scripts/network-status.sh
tail = true
click-left = ~/.config/polybar/scripts/wifi-menu.sh

;==========================================================
; Workspace Name
;==========================================================
[module/window]
type = internal/xwindow
label = %title%
label-foreground = ${colors.accent-alt}
format = <label>
format-maxlen = 60
label-maxlen = 60

;==========================================================
; Battery Module
;==========================================================
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
poll-interval = 5

; Charging format
format-charging = <animation-charging> <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.success}
label-charging = %percentage%%
label-charging-foreground = ${colors.foreground}

; Discharging format
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

; Full battery format
format-full = <label-full>
label-full = " Full"
label-full-foreground = ${colors.success}

; Low battery format
format-low = <animation-low> <label-low>
label-low = "⚠️ %percentage%%"
label-low-foreground = ${colors.urgent}

; LOW BATTERY ANIMATION FRAMES
animation-low-0 = ""
animation-low-0-foreground = ${colors.urgent}
animation-low-1 = ""
animation-low-1-foreground = ${colors.urgent}
animation-low-2 = ""
animation-low-2-foreground = ${colors.urgent}
animation-low-3 = ""
animation-low-3-foreground = ${colors.urgent}
animation-low-4 = ""
animation-low-4-foreground = ${colors.urgent}
animation-low-framerate = 500

; Capacity ramp icons
ramp-capacity-0 = ""
ramp-capacity-0-foreground = ${colors.urgent}
ramp-capacity-1 = ""
ramp-capacity-1-foreground = ${colors.warning}
ramp-capacity-2 = ""
ramp-capacity-2-foreground = ${colors.info}
ramp-capacity-3 = ""
ramp-capacity-3-foreground = ${colors.success}
ramp-capacity-4 = ""
ramp-capacity-4-foreground = ${colors.success}

; Charging animation
animation-charging-0 = ""
animation-charging-0-foreground = ${colors.success}
animation-charging-1 = ""
animation-charging-1-foreground = ${colors.success}
animation-charging-2 = ""
animation-charging-2-foreground = ${colors.success}
animation-charging-3 = ""
animation-charging-3-foreground = ${colors.success}
animation-charging-4 = ""
animation-charging-4-foreground = ${colors.success}
animation-charging-framerate = 500

;==========================================================
; CPU Module
;==========================================================
[module/cpu]
type = internal/cpu
interval = 1

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.accent-alt}
format-prefix-padding = 0
label = %percentage:2%%
label-foreground = ${colors.foreground}
label-padding = 0

;==========================================================
; Memory Module
;==========================================================
[module/memory]
type = internal/memory
interval = 2

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.success}
format-prefix-padding = 0
label = %percentage_used%%
label-foreground = ${colors.foreground}
label-padding = 0

;==========================================================
; Volume Module
;==========================================================
[module/volume]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = "  %percentage%%"
label-volume-foreground = ${colors.accent-alt}
label-volume-padding = 0
use-ui-max = true

format-muted = <label-muted>
label-muted = " muted"
label-muted-foreground = ${colors.urgent}
label-muted-padding = 0

;==========================================================
; Tray Module
;==========================================================
[module/tray]
type = internal/tray
tray-spacing = 4px
tray-size = 60%
format-margin = 0px

;==========================================================
; Date and Time Module
;==========================================================
[module/date]
type = internal/date
interval = 1

date = %I:%M %p
date-alt = %A, %d %B %Y

format = <label>
label = %date%
label-alt = %date-alt%
